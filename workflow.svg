<text x="948" y="346" font-size="13" font-weight="400" fill="#3B4252" text-anchor="start">Retries 3 times. An empty reply retries</text>
<text x="948" y="366" font-size="13" font-weight="400" fill="#3B4252" text-anchor="start">with a bigger token budget. A failed</text>
<text x="948" y="386" font-size="13" font-weight="400" fill="#3B4252" text-anchor="start">source is skipped and noted, so one</text>
<text x="948" y="406" font-size="13" font-weight="400" fill="#3B4252" text-anchor="start">outage does not end the run.</text>
