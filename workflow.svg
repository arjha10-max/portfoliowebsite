<text x="948" y="186" font-size="13" font-weight="400" fill="#3B4252" text-anchor="start">The model only writes one sentence of</text>
<text x="948" y="206" font-size="13" font-weight="400" fill="#3B4252" text-anchor="start">insight per quote and the final report.</text>
<text x="948" y="226" font-size="13" font-weight="400" fill="#3B4252" text-anchor="start">Code then checks every number.</text>
